<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ebebeb;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background-color: #ebebeb;
    }

    .login-card {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      padding: 24px;
    }

    .login-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0a2a66; /* azul marino */
      margin-bottom: 18px;
      border-bottom: 1px solid #d6d6d6;
      padding-bottom: 8px;
      text-align: center;
    }

    .form-control:focus {
      border-color: #0a2a66;
      box-shadow: 0 0 0 0.2rem rgba(10,42,102,0.25);
    }

    .btn-login {
      background-color: #0a2a66;
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: #0d3a8a;
    }

    .material-icons {
      font-size: 1.2rem;
      color: #0a2a66;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h2>Iniciar Sesión</h2>
      <div id="alerta"></div>
      <form id="loginForm">
        
        <!-- Nombre de usuario -->
        <div class="mb-3">
          <label for="nombre_usuario" class="form-label">
            <i class="material-icons">person</i> Nombre de usuario
          </label>
          <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" required>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label for="password" class="form-label">
            <i class="material-icons">lock</i> Contraseña
          </label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <!-- Botón grande de login -->
        <button type="submit" class="btn-login">Ingresar</button>

        <!-- Apartado de registro -->
        <div class="mt-3 text-center">
          <p>¿No tienes una cuenta? 
            <a href="/registrarse" class="link-primary">Regístrate aquí</a>
          </p>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const alerta = document.getElementById('alerta');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        nombre_usuario: document.getElementById('nombre_usuario').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok && result.type === 'success') {
          alerta.innerHTML = `<div class="alert alert-success">${result.msg}</div>`;
          // Redirigir a principal.html
          setTimeout(() => {
            window.location.href = "/administrar_estudiantes.html";
          }, 1000);
        } else {
          alerta.innerHTML = `<div class="alert alert-danger">${result.msg}</div>`;
        }
      } catch (err) {
        alerta.innerHTML = `<div class="alert alert-danger">Error de conexión con el servidor</div>`;
      }
    });
  </script>

</body>
</html>
